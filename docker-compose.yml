services:
  rag:
    build: .
    container_name: rag-docs-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Reach a gateway running on the host machine
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chroma-data:/data

volumes:
  chroma-data:
